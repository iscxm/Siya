<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Techofy · VPS Console</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #090b0f;
    --surface: #0f131a;
    --surface-2: #141922;
    --border: #1e2530;
    --border-soft: #171d27;
    --accent: #35e0c9;
    --accent-dim: #1f8a7c;
    --accent-glow: rgba(53, 224, 201, 0.35);
    --success: #4ade80;
    --warn: #fbbf24;
    --err: #fb7185;
    --info: #60a5fa;
    --text: #e7ebf0;
    --muted: #6b7480;
    --muted-2: #4a515c;
    --mono: 'JetBrains Mono', 'Courier New', monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    overscroll-behavior: none;
  }

  body {
    color: var(--text);
    font-family: var(--mono);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* faint structural grid, barely visible */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .header::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent) 20%, var(--accent) 80%, transparent);
    opacity: 0.5;
    animation: sweep 6s ease-in-out infinite;
  }

  @keyframes sweep {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.6; }
  }

  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }

  .brand-name {
    font-family: var(--sans);
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.3px;
    color: var(--text);
  }

  .brand-sub {
    font-family: var(--sans);
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--success);
    background: rgba(74, 222, 128, 0.08);
    border: 1px solid rgba(74, 222, 128, 0.25);
    padding: 4px 9px 4px 7px;
    border-radius: 20px;
    flex-shrink: 0;
    transition: color 0.3s, border-color 0.3s, background 0.3s;
  }

  .status-pill.offline {
    color: var(--err);
    background: rgba(251, 113, 133, 0.08);
    border-color: rgba(251, 113, 133, 0.25);
  }

  .status-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 6px currentColor;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* ── Sub-bar ── */
  .subbar {
    background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
    padding: 7px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: var(--sans);
    font-size: 10px;
    color: var(--muted-2);
    letter-spacing: 0.3px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .subbar span.hl { color: var(--muted); }

  /* ── Terminal Output ── */
  #output {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    background: var(--bg);
    scroll-behavior: smooth;
    position: relative;
    z-index: 1;
  }

  #output::-webkit-scrollbar { width: 5px; }
  #output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  #output::-webkit-scrollbar-thumb:hover { background: var(--accent-dim); }
  #output::-webkit-scrollbar-track { background: transparent; }

  .line {
    font-size: 12.5px;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    opacity: 0;
    transform: translateY(4px);
    animation: reveal 0.28s ease forwards;
  }

  @keyframes reveal {
    to { opacity: 1; transform: translateY(0); }
  }

  .line.banner { color: var(--muted-2); }
  .line.prompt { color: var(--accent); font-weight: 500; }
  .line.stdout { color: var(--text); }
  .line.stderr { color: var(--err); }
  .line.info   { color: var(--info); }
  .line.system { color: var(--muted); font-style: italic; }
  .line.empty  { height: 6px; animation: none; }

  /* ── Input Area ── */
  .input-area {
    border-top: 1px solid var(--border);
    background: var(--surface);
    padding: 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
  }

  .prompt-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .prompt-wrap:focus-within {
    border-color: var(--accent-dim);
    box-shadow: 0 0 0 3px rgba(53, 224, 201, 0.08);
  }

  .prompt-sym {
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    user-select: none;
  }

  #cmd-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    caret-color: var(--accent);
    min-width: 0;
  }

  #cmd-input::placeholder { color: var(--muted-2); }

  .btn-run {
    background: var(--accent);
    border: none;
    color: #06251f;
    padding: 10px 16px;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2px;
    cursor: pointer;
    transition: transform 0.12s ease, filter 0.15s ease, box-shadow 0.15s ease;
    white-space: nowrap;
    flex-shrink: 0;
    box-shadow: 0 0 0 rgba(53, 224, 201, 0);
  }

  .btn-run:hover { filter: brightness(1.08); box-shadow: 0 0 16px var(--accent-glow); }
  .btn-run:active { transform: scale(0.95); }
  .btn-run:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

  .btn-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 10px 12px;
    border-radius: 8px;
    font-family: var(--sans);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .btn-clear:hover { border-color: var(--muted); color: var(--text); }
  .btn-clear:active { transform: scale(0.95); }

  /* ── Spinner ── */
  .spinner {
    display: inline-block;
    width: 11px; height: 11px;
    border: 2px solid rgba(6,37,31,0.25);
    border-top-color: #06251f;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    vertical-align: -1.5px;
    margin-right: 5px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <div class="brand-name">Techofy Cloud · VPS Console</div>
    <div class="brand-sub" id="session-label">Session initializing…</div>
  </div>
  <div class="status-pill" id="status-pill">
    <span class="status-dot"></span>
    <span id="status-text">Live</span>
  </div>
</div>

<div class="subbar">
  <span>Remote shell over Telegram Bot API</span>
  <span class="hl" id="cmd-count">0 commands</span>
</div>

<div id="output"></div>

<div class="input-area">
  <div class="prompt-wrap">
    <span class="prompt-sym">root@toxic:~#</span>
    <input id="cmd-input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="none" spellcheck="false"
           placeholder="Enter a command…" />
  </div>
  <button class="btn-clear" onclick="clearOutput()">Clear</button>
  <button class="btn-run" id="run-btn" onclick="runCmd()">Run</button>
</div>

<script>
// ── Telegram WebApp Init ───────────────────────────────────────────────────
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
tg.setHeaderColor('#090b0f');
tg.setBackgroundColor('#090b0f');

// ── Read token & owner from URL query params ──────────────────────────────
const _params   = new URLSearchParams(window.location.search);
const BOT_TOKEN = _params.get('token') || '';
const OWNER_ID  = parseInt(_params.get('owner') || tg.initDataUnsafe?.user?.id || '0');

// ── State ───────────────────────────────────────────────────────────────
const output   = document.getElementById('output');
const input    = document.getElementById('cmd-input');
const runBtn   = document.getElementById('run-btn');
const cmdCount = document.getElementById('cmd-count');
const statusPill = document.getElementById('status-pill');
const statusText = document.getElementById('status-text');
const sessionLabel = document.getElementById('session-label');

let history = [];
let histIdx = -1;
let executed = 0;

// ── Helpers ─────────────────────────────────────────────────────────────
function appendLine(text, cls = 'stdout') {
  const div = document.createElement('div');
  div.className = `line ${cls}`;
  div.textContent = text;
  output.appendChild(div);
  output.scrollTop = output.scrollHeight;
}

function appendGap() {
  const div = document.createElement('div');
  div.className = 'line empty';
  output.appendChild(div);
}

function setStatus(online) {
  statusPill.classList.toggle('offline', !online);
  statusText.textContent = online ? 'Live' : 'Offline';
}

function clearOutput() {
  output.innerHTML = '';
  appendLine('Console cleared.', 'system');
}

function updateCount() {
  cmdCount.textContent = `${executed} command${executed === 1 ? '' : 's'}`;
}

// ── Boot sequence ──────────────────────────────────────────────────────
sessionLabel.textContent = OWNER_ID ? `Session owner · ${OWNER_ID}` : 'Session ready';
appendLine('Techofy Cloud VPS Console', 'banner');
appendLine('Connected to remote shell via Telegram Bot API.', 'info');
appendLine('Type a command below and press Run, or hit Enter.', 'system');
appendGap();

// ── Run Command ─────────────────────────────────────────────────────────
async function runCmd() {
  const cmd = input.value.trim();
  if (!cmd) return;

  history.unshift(cmd);
  histIdx = -1;
  if (history.length > 100) history.pop();

  appendLine(`root@toxic:~# ${cmd}`, 'prompt');
  input.value = '';
  runBtn.disabled = true;
  runBtn.innerHTML = '<span class="spinner"></span>Running';

  try {
    const sendRes = await fetch(
      `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: OWNER_ID,
          text: `/sh ${cmd}`,
          disable_notification: true
        })
      }
    );

    if (!sendRes.ok) throw new Error('Bot API error');

    const sendData = await sendRes.json();
    const sentMsgId = sendData.result.message_id;

    let reply = null;
    for (let i = 0; i < 30; i++) {
      await sleep(1000);
      const updRes = await fetch(
        `https://api.telegram.org/bot${BOT_TOKEN}/getUpdates?offset=-1&limit=5&timeout=0`
      );
      const updData = await updRes.json();
      const updates = updData.result || [];

      for (const upd of updates.reverse()) {
        const msg = upd.message || upd.edited_message;
        if (!msg) continue;
        if (msg.message_id <= sentMsgId) continue;
        if (msg.from?.is_bot && msg.chat?.id === OWNER_ID) {
          reply = msg.text || msg.caption || '';
          break;
        }
      }
      if (reply !== null) break;
    }

    if (reply !== null) {
      const lines = reply.replace(/Command:.*?\n\n/s, '').replace(/^Output:\n/m, '');
      appendLine(lines || '(no output)', reply.includes('Error') ? 'stderr' : 'stdout');
    } else {
      appendLine('Timeout — no reply received from bot.', 'stderr');
    }

    executed++;
    updateCount();
    setStatus(true);
  } catch (err) {
    appendLine(`Error: ${err.message}`, 'stderr');
    setStatus(false);
  } finally {
    runBtn.disabled = false;
    runBtn.innerHTML = 'Run';
    input.focus();
    appendGap();
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Keyboard shortcuts ───────────────────────────────────────────────────
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); runCmd(); }

  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (histIdx < history.length - 1) {
      histIdx++;
      input.value = history[histIdx];
    }
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (histIdx > 0) {
      histIdx--;
      input.value = history[histIdx];
    } else {
      histIdx = -1;
      input.value = '';
    }
  }
});

// ── Auto-focus ────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  setTimeout(() => input.focus(), 300);
});
</script>
</body>
</html>
